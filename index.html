<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Snake Game</title>
	<link rel="stylesheet" href="./css/index.css">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=replay" />
</head>
<body>
	<div class="score-label">SCORE: <span class="score-value">0</span></div>
	<div class="menu-screen">
		<span class="game-over">GAME OVER</span>
		<span class="final-score">SCORE: <span class="score-value">0</span></span>
		<button class="btn-play">
			<span class="material-symbols-outlined">
				replay
				</span>
			RETRY
		</button>
	</div>
	<canvas width="600" height="600"></canvas>
	<script src="./js/index.js"></script>
</body>
</html>
